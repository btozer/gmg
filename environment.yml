# CONDA ENVIRONMENT FOR gmg.
#
#   conda env create -f environment.yml
#   conda activate gmgpy
#
# The minimum versions here mirror install_requires in setup.cfg, which is the source of truth for what gmg
# supports. They are floors rather than exact pins: the exact pins this file used to carry had drifted years
# behind the environment gmg was actually being run in, so the file no longer described anything usable.
#
# numpy and netcdf4 were missing here although setup.cfg has always required them; they were being pulled in
# indirectly, which meant the environment could resolve to a numpy incompatible with the other packages.
#
# Last verified against: python 3.14.4, numpy 2.4.3, scipy 1.17.1, matplotlib 3.10.8, wxpython 4.2.5,
# pygmt 0.18.0, obspy 1.5.0, pytest 9.0.3.
name: gmgpy
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.24.4
  - matplotlib>=3.7.2
  - scipy>=1.10.1
  - obspy>=1.4.1
  - wxpython>=4.2.0
  - pygmt>=0.9.0
  - netcdf4>=1.5.6
  - future>=0.18
  - pytest>=8.2.1
  # LAUNCHING THE GUI ON macOS NEEDS THE FRAMEWORK BUILD, WHICH PROVIDES pythonw
  - python.app  # [osx]
